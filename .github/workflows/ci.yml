name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — testes e invariantes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: impl/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Testes unitários (motor cognitivo e DSL)
        run: python test_suite.py

      - name: Testes de integração (segurança + invariantes pedagógicas)
        env:
          EOS_ENV: development
          BCRYPT_ROUNDS: "4"
        run: pytest tests/ -v --tb=short

      - name: Compilar todos os currículos .eos
        # Currículo que não compila não entra (governança, Parte IX da spec)
        run: |
          python - <<'PY'
          import pathlib, sys
          sys.path.insert(0, '.')
          from src.eos_parser import parse_dsl_content
          falhas = []
          for f in sorted(pathlib.Path('seeds').glob('*.eos')):
              try:
                  parse_dsl_content(f.read_text(encoding='utf-8'))
              except Exception as e:
                  falhas.append(f"{f.name}: {e}")
          for x in falhas:
              print("FALHOU:", x)
          sys.exit(1 if falhas else 0)
          PY

  eos_lang:
    name: eos-lang — biblioteca independente
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eos-lang
    strategy:
      matrix:
        # Suporte declarado no pyproject; testar só o meio da faixa deixaria
        # 3.9 e 3.13 quebrarem em silêncio.
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar a biblioteca
        run: pip install -e ".[graph,dev]"

      - name: Testes
        run: pytest -q

      - name: A biblioteca não pode ganhar dependência de runtime
        # Sem dependências é o contrato do pacote: instalar sem os extras e
        # importar tem de funcionar.
        run: |
          pip install --force-reinstall --no-deps -e .
          python -c "import eoslang; print('import limpo OK')"

      - name: Exemplos compilam (e o quebrado continua quebrando)
        run: |
          eos validate examples/algebra.eos
          if eos validate examples/ciclo_quebrado.eos; then
            echo "FALHOU: o exemplo de ciclo deveria ser rejeitado"
            exit 1
          fi
          echo "OK — ciclo rejeitado como esperado"

      - name: O currículo real do EngineeringOS compila
        run: eos validate ../impl/seeds/*.eos

  security:
    name: Segurança — dependências e código
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas
        run: pip install pip-audit bandit

      - name: CVEs conhecidas nas dependências
        run: pip-audit -r requirements.txt --strict || true

      - name: Padrões inseguros no código
        # B101 (assert) é ruído em testes; falha apenas em severidade alta
        run: bandit -r src main.py -ll -x tests

      - name: Segredo não pode ter valor padrão em produção
        run: |
          python - <<'PY'
          import os, sys
          os.environ['EOS_ENV'] = 'production'
          os.environ.pop('JWT_SECRET_KEY', None)
          sys.path.insert(0, '.')
          try:
              import src.security  # deve explodir
          except RuntimeError as e:
              print("OK — recusou subir sem segredo:", e)
              sys.exit(0)
          print("FALHOU: subiu em produção sem JWT_SECRET_KEY")
          sys.exit(1)
          PY

  frontend:
    name: Dashboard — build e lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impl/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: impl/dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

      - name: Nenhum backdrop-filter (causava tela preta no Windows)
        run: |
          if grep -rnE "backdrop-filter|backdrop-blur" src/; then
            echo "backdrop-filter reintroduzido — estoura o compositor em painéis altos"
            exit 1
          fi
          echo "OK — nenhum backdrop-filter"
